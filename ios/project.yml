name: PathHome
options:
  bundleIdPrefix: com.abhishekmangla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Team in Xcode (Signing & Capabilities) before installing on a device.
    DEVELOPMENT_TEAM: 75YY993Y27

targets:
  PathHome:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekmangla.pathhome
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PATH Home
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Finds the PATH station closest to you and how long it takes to walk there.
        NSLocationAlwaysAndWhenInUseUsageDescription: Lets the widget follow you to the nearest PATH station without opening the app. Only coarse movement near stations is used.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pathhome]
    entitlements:
      path: App/PathHome.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abhishekmangla.pathhome]
    dependencies:
      - target: PathHomeWidget

  PathHomeWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekmangla.pathhome.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PATH Home
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PathHomeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.abhishekmangla.pathhome]

  PathHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PathHome
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abhishekmangla.pathhome.tests

schemes:
  PathHome:
    build:
      targets:
        PathHome: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [PathHomeTests]
